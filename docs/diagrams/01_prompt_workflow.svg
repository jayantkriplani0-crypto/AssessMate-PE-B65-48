<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="320" viewBox="0 0 1040 320">
  <rect width="1040" height="320" fill="#ffffff" rx="10"/>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#1e3a8a"/>
    </marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
    </marker>
  </defs>
  <text x="520" y="32" font-family="Segoe UI, Arial" font-size="17" font-weight="bold" fill="#0f172a" text-anchor="middle">AssessMate Prompt Workflow (RAG + 3-Prompt Chained Pipeline)</text>

  <!-- 1. User Input -->
  <rect x="20" y="75" width="145" height="96" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="92" y="102" font-family="Segoe UI, Arial" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">1. User Inputs</text>
  <text x="92" y="122" font-family="Segoe UI, Arial" font-size="11" fill="#334155" text-anchor="middle">Syllabus PDF/Corpus,</text>
  <text x="92" y="138" font-family="Segoe UI, Arial" font-size="11" fill="#334155" text-anchor="middle">Topic, LO, Bloom, Type,</text>
  <text x="92" y="154" font-family="Segoe UI, Arial" font-size="11" fill="#334155" text-anchor="middle">Difficulty, Marks, Qty</text>
  <line x1="165" y1="123" x2="195" y2="123" stroke="#1e3a8a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 2. Module 1 -->
  <rect x="200" y="75" width="160" height="96" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="280" y="102" font-family="Segoe UI, Arial" font-size="13" font-weight="bold" fill="#854d0e" text-anchor="middle">2. Module 1 (RAG)</text>
  <text x="280" y="122" font-family="Segoe UI, Arial" font-size="11" fill="#334155" text-anchor="middle">Input Validation +</text>
  <text x="280" y="138" font-family="Segoe UI, Arial" font-size="11" fill="#334155" text-anchor="middle">Top-2 Syllabus Chunk</text>
  <text x="280" y="154" font-family="Segoe UI, Arial" font-size="11" fill="#334155" text-anchor="middle">Retrieval (TF-IDF)</text>
  <line x1="360" y1="123" x2="390" y2="123" stroke="#1e3a8a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 3. Prompt P1 -->
  <rect x="395" y="75" width="165" height="96" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="477" y="102" font-family="Segoe UI, Arial" font-size="13" font-weight="bold" fill="#312e81" text-anchor="middle">3. Prompt P1 (t=0.2)</text>
  <text x="477" y="122" font-family="Segoe UI, Arial" font-size="11" fill="#334155" text-anchor="middle">Question Generator</text>
  <text x="477" y="138" font-family="Segoe UI, Arial" font-size="11" fill="#334155" text-anchor="middle">Bloom Verbs + Few-Shot</text>
  <text x="477" y="154" font-family="Segoe UI, Arial" font-size="11" fill="#334155" text-anchor="middle">Grounding Guardrail</text>
  <line x1="560" y1="123" x2="590" y2="123" stroke="#1e3a8a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 4. Prompt P2 -->
  <rect x="595" y="75" width="170" height="96" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="680" y="102" font-family="Segoe UI, Arial" font-size="13" font-weight="bold" fill="#164e63" text-anchor="middle">4. Prompt P2 (t=0.2)</text>
  <text x="680" y="122" font-family="Segoe UI, Arial" font-size="11" fill="#334155" text-anchor="middle">Answer Key &amp; Rubric</text>
  <text x="680" y="138" font-family="Segoe UI, Arial" font-size="11" fill="#334155" text-anchor="middle">Stepwise Criteria +</text>
  <text x="680" y="154" font-family="Segoe UI, Arial" font-size="11" fill="#334155" text-anchor="middle">Exact Mark Sum Check</text>
  <line x1="765" y1="123" x2="795" y2="123" stroke="#1e3a8a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 5. Prompt P3 -->
  <rect x="800" y="75" width="215" height="96" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="907" y="102" font-family="Segoe UI, Arial" font-size="13" font-weight="bold" fill="#14532d" text-anchor="middle">5. Prompt P3 (t=0.1)</text>
  <text x="907" y="122" font-family="Segoe UI, Arial" font-size="11" fill="#334155" text-anchor="middle">5-Axis Rubric Critic (1-5)</text>
  <text x="907" y="138" font-family="Segoe UI, Arial" font-size="11" fill="#334155" text-anchor="middle">PASS or REVISE + Rewrite</text>
  <text x="907" y="154" font-family="Segoe UI, Arial" font-size="11" fill="#334155" text-anchor="middle">+ Faculty Approval Flag</text>

  <!-- Rejection branches -->
  <path d="M 280 171 L 280 232 L 320 232" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrRed)"/>
  <path d="M 477 171 L 477 205 L 477 212" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrRed)"/>
  <rect x="325" y="216" width="335" height="46" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="492" y="236" font-family="Segoe UI, Arial" font-size="12" font-weight="bold" fill="#991b1b" text-anchor="middle">Short-Circuit Rejection (REJECTED)</text>
  <text x="492" y="253" font-family="Segoe UI, Arial" font-size="11" fill="#7f1d1d" text-anchor="middle">Vague input, conflict, or out-of-syllabus topic</text>

  <!-- Output note -->
  <rect x="740" y="216" width="275" height="46" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="877" y="236" font-family="Segoe UI, Arial" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Teacher-in-the-Loop Output</text>
  <text x="877" y="253" font-family="Segoe UI, Arial" font-size="11" fill="#475569" text-anchor="middle">Streamlit Tabs + JSON / Markdown Export</text>
  <line x1="907" y1="171" x2="907" y2="212" stroke="#1e3a8a" stroke-width="2" marker-end="url(#arr)"/>
</svg>
