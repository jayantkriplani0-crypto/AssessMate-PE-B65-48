<svg xmlns="http://www.w3.org/2000/svg" width="980" height="250" viewBox="0 0 980 250">
  <rect width="980" height="250" fill="#ffffff" rx="10"/>
  <defs>
    <marker id="arr5" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#0f172a"/>
    </marker>
  </defs>
  <text x="490" y="32" font-family="Segoe UI, Arial" font-size="17" font-weight="bold" fill="#0f172a" text-anchor="middle">Syllabus Document Grounding (RAG) Pipeline</text>

  <rect x="20" y="75" width="165" height="110" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="102" y="102" font-family="Segoe UI, Arial" font-size="12.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">1. Syllabus Sources</text>
  <text x="102" y="126" font-family="Segoe UI, Arial" font-size="11" fill="#334155" text-anchor="middle">Uploaded PDF (pypdf),</text>
  <text x="102" y="143" font-family="Segoe UI, Arial" font-size="11" fill="#334155" text-anchor="middle">Custom Text, or</text>
  <text x="102" y="160" font-family="Segoe UI, Arial" font-size="11" fill="#334155" text-anchor="middle">CS Syllabus Corpus</text>
  <line x1="185" y1="130" x2="215" y2="130" stroke="#0f172a" stroke-width="2" marker-end="url(#arr5)"/>

  <rect x="220" y="75" width="165" height="110" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="1.8"/>
  <text x="302" y="102" font-family="Segoe UI, Arial" font-size="12.5" font-weight="bold" fill="#854d0e" text-anchor="middle">2. Text Chunking</text>
  <text x="302" y="126" font-family="Segoe UI, Arial" font-size="11" fill="#334155" text-anchor="middle">Split by paragraphs</text>
  <text x="302" y="143" font-family="Segoe UI, Arial" font-size="11" fill="#334155" text-anchor="middle">into ~160-word</text>
  <text x="302" y="160" font-family="Segoe UI, Arial" font-size="11" fill="#334155" text-anchor="middle">overlapping passages</text>
  <line x1="385" y1="130" x2="415" y2="130" stroke="#0f172a" stroke-width="2" marker-end="url(#arr5)"/>

  <rect x="420" y="75" width="175" height="110" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8"/>
  <text x="507" y="102" font-family="Segoe UI, Arial" font-size="12.5" font-weight="bold" fill="#312e81" text-anchor="middle">3. TF-IDF Retrieval</text>
  <text x="507" y="126" font-family="Segoe UI, Arial" font-size="11" fill="#334155" text-anchor="middle">Query = Topic + LO</text>
  <text x="507" y="143" font-family="Segoe UI, Arial" font-size="11" fill="#334155" text-anchor="middle">Rank chunks by TF-IDF</text>
  <text x="507" y="160" font-family="Segoe UI, Arial" font-size="11" fill="#334155" text-anchor="middle">+ exact topic boost</text>
  <line x1="595" y1="130" x2="625" y2="130" stroke="#0f172a" stroke-width="2" marker-end="url(#arr5)"/>

  <rect x="630" y="75" width="160" height="110" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.8"/>
  <text x="710" y="102" font-family="Segoe UI, Arial" font-size="12.5" font-weight="bold" fill="#164e63" text-anchor="middle">4. Context Injection</text>
  <text x="710" y="126" font-family="Segoe UI, Arial" font-size="11" fill="#334155" text-anchor="middle">Inject top-2 chunks</text>
  <text x="710" y="143" font-family="Segoe UI, Arial" font-size="11" fill="#334155" text-anchor="middle">with [chunk_id] into</text>
  <text x="710" y="160" font-family="Segoe UI, Arial" font-size="11" fill="#334155" text-anchor="middle">P1, P2, and P3</text>
  <line x1="790" y1="130" x2="820" y2="130" stroke="#0f172a" stroke-width="2" marker-end="url(#arr5)"/>

  <rect x="825" y="75" width="135" height="110" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="892" y="102" font-family="Segoe UI, Arial" font-size="12.5" font-weight="bold" fill="#991b1b" text-anchor="middle">5. Grounding Check</text>
  <text x="892" y="126" font-family="Segoe UI, Arial" font-size="11" fill="#334155" text-anchor="middle">If topic absent from</text>
  <text x="892" y="143" font-family="Segoe UI, Arial" font-size="11" fill="#334155" text-anchor="middle">retrieved chunks,</text>
  <text x="892" y="160" font-family="Segoe UI, Arial" font-size="11" fill="#991b1b" font-weight="bold" text-anchor="middle">return REJECTED</text>
</svg>
